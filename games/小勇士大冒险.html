<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🦕 小勇士大冒险 - 5关闯关游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 900px;
    max-height: 600px;
  }
  canvas {
    display: block;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(100, 200, 255, 0.3);
  }
  #hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 16px;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 20px;
    pointer-events: none;
    animation: pulse 1.5s ease-in-out infinite;
    letter-spacing: 2px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <div id="hint">按空格键 或 点击屏幕 跳跃 🦘</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  // --- Canvas Setup ---
  const W = 800, H = 450;
  let scale = 1;

  function resize() {
    const container = document.getElementById('game-container');
    const maxW = Math.min(window.innerWidth, 900);
    const maxH = Math.min(window.innerHeight, 600);
    scale = Math.min(maxW / W, maxH / H);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Audio ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playBeep(freq, dur, type = 'square', vol = 0.08) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  function sfxJump() { playBeep(400, 0.12, 'square', 0.06); playBeep(600, 0.08, 'square', 0.04); }
  function sfxStar() { playBeep(880, 0.1, 'sine', 0.07); setTimeout(() => playBeep(1100, 0.1, 'sine', 0.07), 60); }
  function sfxHit() { playBeep(100, 0.25, 'sawtooth', 0.1); }
  function sfxLevelUp() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playBeep(f, 0.2, 'sine', 0.08), i * 100));
  }
  function sfxWin() {
    [523, 659, 784, 880, 1047, 1175, 1319, 1568].forEach((f, i) => setTimeout(() => playBeep(f, 0.25, 'sine', 0.08), i * 80));
  }
  function sfxGameOver() {
    [400, 350, 300, 200].forEach((f, i) => setTimeout(() => playBeep(f, 0.2, 'triangle', 0.08), i * 120));
  }

  // --- Level Config ---
  const LEVELS = [
    { name: '🌳 绿色森林', sky: ['#87CEEB', '#B0E0E6'], ground: '#5D8C3E', ground2: '#4A7A2E',
      obstacleColor: '#8B5E3C', obstacleColor2: '#6B3F2A', starTarget: 5,
      speed: 2.2, obsFreq: 130, obsMinH: 30, obsMaxH: 45, bgDecor: 'forest' },
    { name: '🏜️ 金色沙漠', sky: ['#FFD89B', '#F5A623'], ground: '#E8C96A', ground2: '#D4A84B',
      obstacleColor: '#5D8A3C', obstacleColor2: '#3D6A1C', starTarget: 7,
      speed: 2.8, obsFreq: 110, obsMinH: 35, obsMaxH: 55, bgDecor: 'desert' },
    { name: '❄️ 蓝色冰川', sky: ['#B0D4F1', '#6BAED6'], ground: '#D5E8F0', ground2: '#B8D4E8',
      obstacleColor: '#A8D8EA', obstacleColor2: '#7EC8E3', starTarget: 8,
      speed: 3.4, obsFreq: 95, obsMinH: 35, obsMaxH: 60, bgDecor: 'ice' },
    { name: '🌋 红色火山', sky: ['#FF6B6B', '#C0392B'], ground: '#5D4037', ground2: '#3E2723',
      obstacleColor: '#FF4444', obstacleColor2: '#CC0000', starTarget: 10,
      speed: 4.0, obsFreq: 80, obsMinH: 35, obsMaxH: 60, bgDecor: 'volcano' },
    { name: '🌌 紫色星空', sky: ['#1A0A3E', '#4A1A8E'], ground: '#2D1B4E', ground2: '#1A0A3E',
      obstacleColor: '#9B59B6', obstacleColor2: '#6C3483', starTarget: 12,
      speed: 4.6, obsFreq: 65, obsMinH: 35, obsMaxH: 65, bgDecor: 'space' },
  ];

  // --- Game State ---
  const STATE = { MENU: 'menu', PLAYING: 'playing', LEVEL_COMPLETE: 'levelComplete', GAME_OVER: 'gameOver', VICTORY: 'victory' };
  let gameState = STATE.MENU;
  let currentLevel = 0;
  let level = LEVELS[0];
  let starsCollected = 0;
  let lives = 5;
  let score = 0;
  let frameCount = 0;
  let obsTimer = 0;
  let starTimer = 0;
  let shakeTimer = 0;
  let shakeIntensity = 0;
  let stateTimer = 0;
  let transitionAlpha = 0;

  // --- Player ---
  const GROUND_Y = 370;
  const player = {
    x: 130, y: GROUND_Y, w: 48, h: 56,
    vy: 0, onGround: true, invincible: 0,
    legFrame: 0, eyeBlink: 0,
  };

  // --- Objects ---
  let obstacles = [];
  let stars = [];
  let particles = [];
  let bgParticles = [];

  // --- Input ---
  let jumpPressed = false;
  let jumpBuffered = 0;

  function handleJump() {
    initAudio();
    jumpPressed = true;
    jumpBuffered = 8; // buffer jump for a few frames
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      handleJump();
      if (gameState === STATE.MENU) startGame();
      if (gameState === STATE.GAME_OVER) restartLevel();
      if (gameState === STATE.VICTORY) resetGame();
    }
  });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleJump();
    if (gameState === STATE.MENU) startGame();
    if (gameState === STATE.GAME_OVER) restartLevel();
    if (gameState === STATE.VICTORY) resetGame();
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleJump();
    if (gameState === STATE.MENU) startGame();
    if (gameState === STATE.GAME_OVER) restartLevel();
    if (gameState === STATE.VICTORY) resetGame();
  }, { passive: false });

  // --- Game Functions ---
  function startGame() {
    initAudio();
    gameState = STATE.PLAYING;
    currentLevel = 0;
    score = 0;
    lives = 5;
    resetLevel();
  }

  function resetLevel() {
    level = LEVELS[currentLevel];
    starsCollected = 0;
    obstacles = [];
    stars = [];
    particles = [];
    bgParticles = [];
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
    player.invincible = 0;
    player.legFrame = 0;
    obsTimer = 0;
    starTimer = 0;
    shakeTimer = 0;
    shakeIntensity = 0;
    stateTimer = 0;
    transitionAlpha = 0;
    frameCount = 0;
    jumpBuffered = 0;
    initBgParticles();
  }

  function restartLevel() {
    lives = 5;
    score = Math.max(0, score - 10);
    resetLevel();
    gameState = STATE.PLAYING;
  }

  function resetGame() {
    currentLevel = 0;
    score = 0;
    lives = 5;
    resetLevel();
    gameState = STATE.PLAYING;
  }

  function initBgParticles() {
    bgParticles = [];
    const count = level.bgDecor === 'space' ? 60 : level.bgDecor === 'ice' ? 25 : 15;
    for (let i = 0; i < count; i++) {
      bgParticles.push({
        x: Math.random() * W,
        y: Math.random() * (GROUND_Y - 20),
        size: level.bgDecor === 'space' ? Math.random() * 2.5 + 0.5 : Math.random() * 4 + 1,
        speed: level.bgDecor === 'space' ? Math.random() * 0.5 + 0.1 : Math.random() * 0.4 + 0.1,
        opacity: Math.random() * 0.6 + 0.2,
      });
    }
  }

  function spawnObstacle() {
    const minH = level.obsMinH;
    const maxH = level.obsMaxH;
    const h = minH + Math.random() * (maxH - minH);
    const w = h * (0.6 + Math.random() * 0.4);
    obstacles.push({
      x: W + 20,
      y: GROUND_Y,
      w: w,
      h: h,
      color: level.obstacleColor,
      color2: level.obstacleColor2,
      type: Math.floor(Math.random() * 3), // 0=box, 1=triangle, 2=round
    });
  }

  function spawnStar() {
    const x = W + Math.random() * 200;
    const y = GROUND_Y - 50 - Math.random() * 160; // float above ground
    stars.push({
      x: x, y: y,
      r: 12,
      angle: Math.random() * Math.PI * 2,
      bobOffset: Math.random() * Math.PI * 2,
    });
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        life: 30 + Math.random() * 20,
        maxLife: 50,
        color: color,
        size: Math.random() * 4 + 2,
      });
    }
  }

  function hitPlayer() {
    if (player.invincible > 0) return;
    lives--;
    sfxHit();
    shakeTimer = 20;
    shakeIntensity = 8;
    player.invincible = 90; // 1.5 seconds invincible
    spawnParticles(player.x, player.y - player.h/2, '#FF4444', 20);
    if (lives <= 0) {
      gameState = STATE.GAME_OVER;
      stateTimer = 0;
      sfxGameOver();
    }
  }

  function collectStar(star) {
    starsCollected++;
    score += 10;
    sfxStar();
    spawnParticles(star.x, star.y, '#FFD700', 12);
    if (starsCollected >= level.starTarget) {
      if (currentLevel >= LEVELS.length - 1) {
        gameState = STATE.VICTORY;
        stateTimer = 0;
        sfxWin();
      } else {
        gameState = STATE.LEVEL_COMPLETE;
        stateTimer = 0;
        sfxLevelUp();
      }
    }
  }

  // --- Update ---
  function update() {
    frameCount++;

    if (gameState === STATE.PLAYING) {
      // Jump buffer
      if (jumpBuffered > 0) {
        if (player.onGround) {
          player.vy = -11.5;
          player.onGround = false;
          sfxJump();
          jumpBuffered = 0;
        } else {
          jumpBuffered--;
        }
      }
      jumpPressed = false;

      // Player physics
      player.vy += 0.55; // gravity
      player.y += player.vy;
      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.onGround = true;
        player.legFrame = (player.legFrame + 0.15) % 2;
      }

      // Invincibility
      if (player.invincible > 0) player.invincible--;

      // Spawn obstacles
      obsTimer++;
      if (obsTimer >= level.obsFreq + Math.random() * 40) {
        obsTimer = 0;
        spawnObstacle();
      }

      // Spawn stars
      starTimer++;
      if (starTimer >= 45 + Math.random() * 35) {
        starTimer = 0;
        spawnStar();
      }

      // Move obstacles
      obstacles.forEach(o => o.x -= level.speed);
      obstacles = obstacles.filter(o => o.x > -60);

      // Move stars
      stars.forEach(s => {
        s.x -= level.speed;
        s.angle += 0.03;
      });
      stars = stars.filter(s => s.x > -30);

      // Update particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);

      // Update bg particles
      bgParticles.forEach(bp => {
        bp.x -= bp.speed * level.speed * 0.3;
        if (bp.x < -10) { bp.x = W + 10; bp.y = Math.random() * (GROUND_Y - 20); }
      });

      // Collision: obstacles
      const px = player.x - player.w/2 + 10;
      const py = player.y - player.h;
      const pw = player.w - 20;
      const ph = player.h - 8;
      for (const o of obstacles) {
        const ox = o.x - o.w/2;
        const oy = o.y - o.h;
        if (px < ox + o.w && px + pw > ox && py < oy + o.h && py + ph > oy) {
          hitPlayer();
          break;
        }
      }

      // Collision: stars
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        const dx = player.x - s.x;
        const dy = (player.y - player.h/2) - s.y;
        if (Math.sqrt(dx*dx + dy*dy) < s.r + 22) {
          collectStar(s);
          stars.splice(i, 1);
        }
      }

      // Shake decay
      if (shakeTimer > 0) shakeTimer--;
    }

    // State transitions
    if (gameState === STATE.LEVEL_COMPLETE) {
      stateTimer++;
      if (stateTimer > 90) {
        currentLevel++;
        resetLevel();
        gameState = STATE.PLAYING;
      }
    }
    if (gameState === STATE.GAME_OVER) {
      stateTimer++;
    }
    if (gameState === STATE.VICTORY) {
      stateTimer++;
    }
  }

  // --- Render ---
  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, level.sky[0]);
    grad.addColorStop(1, level.sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, GROUND_Y);
  }

  function drawGround() {
    ctx.fillStyle = level.ground;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    // Ground line
    ctx.fillStyle = level.ground2;
    ctx.fillRect(0, GROUND_Y, W, 6);
    // Grass/ground texture dots
    ctx.fillStyle = level.ground2;
    for (let i = 0; i < 30; i++) {
      const gx = (i * 28 + frameCount * level.speed * 0.5) % W;
      ctx.beginPath();
      if (level.bgDecor === 'ice') {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(gx, GROUND_Y + 8, 8, 3);
      } else if (level.bgDecor === 'desert') {
        ctx.fillStyle = level.ground2;
        ctx.arc(gx, GROUND_Y + 6, 3, 0, Math.PI);
        ctx.fill();
      } else if (level.bgDecor === 'volcano') {
        ctx.fillStyle = 'rgba(255,100,50,0.4)';
        ctx.fillRect(gx, GROUND_Y + 5, 6, 3);
      } else {
        ctx.fillStyle = level.ground2;
        ctx.fillRect(gx, GROUND_Y + 4, 4, 8);
      }
    }
  }

  function drawBgDecorations() {
    const t = frameCount * level.speed * 0.2;
    if (level.bgDecor === 'forest') {
      // Hills
      ctx.fillStyle = '#7CBF5E';
      for (let i = 0; i < 5; i++) {
        const hx = (i * 180 - t * 0.3) % (W + 200) - 100;
        ctx.beginPath();
        ctx.arc(hx, GROUND_Y, 80 + i * 20, Math.PI, 0);
        ctx.fill();
      }
      ctx.fillStyle = '#8FCF6E';
      for (let i = 0; i < 4; i++) {
        const hx = (i * 220 + 80 - t * 0.25) % (W + 240) - 120;
        ctx.beginPath();
        ctx.arc(hx, GROUND_Y, 55 + i * 15, Math.PI, 0);
        ctx.fill();
      }
      // Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (let i = 0; i < 3; i++) {
        const cx = (i * 280 - t * 0.1) % (W + 200) - 100;
        const cy = 50 + i * 30;
        drawCloud(cx, cy, 1 + i * 0.3);
      }
    } else if (level.bgDecor === 'desert') {
      // Dunes
      ctx.fillStyle = '#E8C96A';
      for (let i = 0; i < 4; i++) {
        const dx = (i * 220 - t * 0.3) % (W + 220) - 100;
        ctx.beginPath();
        ctx.arc(dx, GROUND_Y, 100, Math.PI, 0);
        ctx.fill();
      }
      ctx.fillStyle = '#D4A84B';
      for (let i = 0; i < 3; i++) {
        const dx = (i * 250 + 100 - t * 0.25) % (W + 250) - 120;
        ctx.beginPath();
        ctx.arc(dx, GROUND_Y, 70, Math.PI, 0);
        ctx.fill();
      }
      // Sun
      ctx.fillStyle = '#FFE082';
      ctx.beginPath();
      ctx.arc(650, 70, 45, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFD54F';
      ctx.beginPath();
      ctx.arc(650, 70, 35, 0, Math.PI * 2);
      ctx.fill();
    } else if (level.bgDecor === 'ice') {
      // Mountains
      ctx.fillStyle = '#D5E8F0';
      for (let i = 0; i < 4; i++) {
        const mx = (i * 200 - t * 0.2) % (W + 200) - 100;
        ctx.beginPath();
        ctx.moveTo(mx, GROUND_Y);
        ctx.lineTo(mx + 80, GROUND_Y - 120 - i * 20);
        ctx.lineTo(mx + 160, GROUND_Y);
        ctx.fill();
      }
      ctx.fillStyle = '#E8F4F8';
      for (let i = 0; i < 4; i++) {
        const mx = (i * 200 - t * 0.2) % (W + 200) - 100;
        ctx.beginPath();
        ctx.moveTo(mx + 60, GROUND_Y - 120 - i * 20);
        ctx.lineTo(mx + 80, GROUND_Y - 150 - i * 25);
        ctx.lineTo(mx + 100, GROUND_Y - 120 - i * 20);
        ctx.fill();
      }
      // Snowflakes in bgParticles
    } else if (level.bgDecor === 'volcano') {
      // Volcano
      ctx.fillStyle = '#4A2C2A';
      const vx = 600 - t * 0.1;
      ctx.beginPath();
      ctx.moveTo(vx, GROUND_Y);
      ctx.lineTo(vx + 40, GROUND_Y - 140);
      ctx.lineTo(vx + 80, GROUND_Y);
      ctx.fill();
      ctx.fillStyle = '#FF6B35';
      ctx.beginPath();
      ctx.moveTo(vx + 20, GROUND_Y - 140);
      ctx.lineTo(vx + 40, GROUND_Y - 170);
      ctx.lineTo(vx + 60, GROUND_Y - 140);
      ctx.fill();
      // Lava glow
      ctx.fillStyle = 'rgba(255,100,30,0.3)';
      ctx.beginPath();
      ctx.arc(vx + 40, GROUND_Y - 145, 25, 0, Math.PI*2);
      ctx.fill();
      // Smoke
      ctx.fillStyle = 'rgba(80,80,80,0.4)';
      for (let i = 0; i < 3; i++) {
        const sx = vx + 40 + Math.sin(t*0.05 + i) * 20;
        const sy = GROUND_Y - 185 - i * 25 - Math.sin(t*0.03 + i) * 10;
        ctx.beginPath();
        ctx.arc(sx, sy, 15 + i*5, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (level.bgDecor === 'space') {
      // Stars in bg (already in bgParticles)
      // Planet
      ctx.fillStyle = '#6C5CE7';
      ctx.beginPath();
      ctx.arc(600, 80, 35, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.arc(585, 70, 15, 0, Math.PI * 2);
      ctx.fill();
      // Ring
      ctx.strokeStyle = 'rgba(200,180,255,0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(600, 80, 55, 15, -0.3, 0, Math.PI * 2);
      ctx.stroke();
      // Moon
      ctx.fillStyle = '#DDD';
      ctx.beginPath();
      ctx.arc(150, 65, 20, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#CCC';
      ctx.beginPath();
      ctx.arc(145, 60, 6, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y - 8 * s, 16 * s, 0, Math.PI * 2);
    ctx.arc(x + 40 * s, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y + 5 * s, 14 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBgParticles() {
    bgParticles.forEach(bp => {
      ctx.fillStyle = level.bgDecor === 'space'
        ? `rgba(255,255,255,${bp.opacity})`
        : `rgba(255,255,255,${bp.opacity * 0.5})`;
      ctx.beginPath();
      if (level.bgDecor === 'space') {
        // Star shape
        const sz = bp.size;
        ctx.arc(bp.x, bp.y, sz, 0, Math.PI * 2);
      } else if (level.bgDecor === 'ice') {
        // Snowflake dot
        ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
      } else {
        ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
      }
      ctx.fill();
    });
  }

  function drawPlayer() {
    const x = player.x;
    const y = player.y - player.h/2;
    const inv = player.invincible;

    // Skip rendering every other 4 frames during invincibility for flash
    if (inv > 0 && Math.floor(inv / 4) % 2 === 0) return;

    ctx.save();
    ctx.translate(x, y + player.h);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, -2, 20, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs (animated)
    const legBob = player.onGround ? Math.sin(frameCount * 0.25) * 5 : 0;
    ctx.fillStyle = '#388E3C';
    // Left leg
    ctx.fillRect(-14, -18 + legBob, 10, 18);
    // Right leg
    ctx.fillRect(4, -18 - legBob, 10, 18);
    // Feet
    ctx.fillStyle = '#2E7D32';
    ctx.fillRect(-16, -4 + legBob, 14, 6);
    ctx.fillRect(2, -4 - legBob, 14, 6);

    // Tail
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath();
    ctx.moveTo(-22, -38);
    ctx.quadraticCurveTo(-35, -30, -30, -18);
    ctx.quadraticCurveTo(-25, -28, -18, -34);
    ctx.fill();

    // Body
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath();
    ctx.ellipse(0, -32, 22, 26, 0, 0, Math.PI * 2);
    ctx.fill();

    // Belly
    ctx.fillStyle = '#81C784';
    ctx.beginPath();
    ctx.ellipse(0, -26, 15, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    // Spikes on back
    ctx.fillStyle = '#2E7D32';
    for (let i = 0; i < 4; i++) {
      const sx = -12 + i * 8;
      const sy = -58 + i * 3;
      ctx.beginPath();
      ctx.moveTo(sx - 3, sy + 8);
      ctx.lineTo(sx + 2, sy - 6);
      ctx.lineTo(sx + 7, sy + 8);
      ctx.fill();
    }

    // Eyes
    const blinkH = (player.eyeBlink > 0) ? 2 : 9;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.ellipse(-8, -40, 8, blinkH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(8, -40, 8, blinkH, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pupils
    if (blinkH > 3) {
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-6, -39, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(10, -39, 4, 0, Math.PI * 2);
      ctx.fill();
      // Highlights
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(-8, -41, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(8, -41, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Cheeks
    ctx.fillStyle = 'rgba(255,150,150,0.5)';
    ctx.beginPath();
    ctx.ellipse(-16, -28, 5, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(16, -28, 5, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Mouth
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -26, 9, 0.15, Math.PI - 0.15);
    ctx.stroke();

    ctx.restore();
  }

  function drawObstacle(o) {
    ctx.save();
    ctx.translate(o.x, o.y - o.h);

    if (o.type === 0) {
      // Box/block
      ctx.fillStyle = o.color;
      ctx.fillRect(-o.w/2, 0, o.w, o.h);
      ctx.fillStyle = o.color2;
      ctx.fillRect(-o.w/2, 0, o.w, 8);
      // Outline
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-o.w/2, 0, o.w, o.h);
      // Face on obstacle (cute)
      if (o.w > 35 && o.h > 35) {
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(-6, o.h/2 - 4, 5, 0, Math.PI*2);
        ctx.arc(6, o.h/2 - 4, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(-4, o.h/2 - 3, 2.5, 0, Math.PI*2);
        ctx.arc(8, o.h/2 - 3, 2.5, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (o.type === 1) {
      // Triangle/spike
      ctx.fillStyle = o.color;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(o.w/2, o.h);
      ctx.lineTo(-o.w/2, o.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = o.color2;
      ctx.lineWidth = 3;
      ctx.stroke();
    } else {
      // Round rock
      ctx.fillStyle = o.color;
      ctx.beginPath();
      ctx.ellipse(0, o.h/2, o.w/2, o.h/2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = o.color2;
      ctx.beginPath();
      ctx.ellipse(-o.w/6, o.h/3, o.w/5, o.h/4, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, o.h/2, o.w/2, o.h/2, 0, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawStar(s) {
    ctx.save();
    ctx.translate(s.x, s.y + Math.sin(frameCount * 0.06 + s.bobOffset) * 5);
    ctx.rotate(s.angle * 0.3);

    // Glow
    ctx.fillStyle = 'rgba(255,215,0,0.3)';
    ctx.beginPath();
    ctx.arc(0, 0, s.r + 6, 0, Math.PI * 2);
    ctx.fill();

    // Star shape
    ctx.fillStyle = '#FFD700';
    ctx.strokeStyle = '#FFA000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
      const outerX = Math.cos(a) * s.r;
      const outerY = Math.sin(a) * s.r;
      const innerA = a + Math.PI / 5;
      const innerX = Math.cos(innerA) * (s.r * 0.4);
      const innerY = Math.sin(innerA) * (s.r * 0.4);
      if (i === 0) ctx.moveTo(outerX, outerY);
      else ctx.lineTo(outerX, outerY);
      ctx.lineTo(innerX, innerY);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Inner shine
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(-2, -2, s.r * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawParticles() {
    particles.forEach(p => {
      const alpha = p.life / p.maxLife;
      ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
      if (p.color.startsWith('#')) {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    // Stars collected
    const hudY = 30;
    // Star icon
    ctx.fillStyle = '#FFD700';
    ctx.strokeStyle = '#FFA000';
    ctx.lineWidth = 2;
    const sx = 25, sy = hudY;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
      const ox = Math.cos(a) * 14;
      const oy = Math.sin(a) * 14;
      const ia = a + Math.PI / 5;
      const ix = Math.cos(ia) * 5.5;
      const iy = Math.sin(ia) * 5.5;
      if (i === 0) ctx.moveTo(sx + ox, sy + oy);
      else ctx.lineTo(sx + ox, sy + oy);
      ctx.lineTo(sx + ix, sy + iy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Star count
    ctx.fillStyle = 'white';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`${starsCollected}/${level.starTarget}`, 48, hudY + 8);

    // Lives (hearts)
    for (let i = 0; i < lives; i++) {
      const hx = W - 40 - i * 35;
      drawHeart(hx, hudY - 8, 16);
    }

    // Level name
    ctx.fillStyle = 'white';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(level.name, W/2, hudY + 3);

    // Score
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '14px Arial';
    ctx.textAlign = 'right';
    ctx.fillText(`得分: ${score}`, W - 20, hudY + 30);
  }

  function drawHeart(x, y, size) {
    ctx.fillStyle = '#FF4444';
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.3);
    ctx.bezierCurveTo(x, y - size * 0.3, x - size, y - size * 0.3, x - size, y + size * 0.3);
    ctx.bezierCurveTo(x - size, y + size * 0.9, x, y + size * 1.3, x, y + size * 1.3);
    ctx.bezierCurveTo(x, y + size * 1.3, x + size, y + size * 0.9, x + size, y + size * 0.3);
    ctx.bezierCurveTo(x + size, y - size * 0.3, x, y - size * 0.3, x, y + size * 0.3);
    ctx.fill();
  }

  function drawMenuScreen() {
    drawSky();
    drawGround();
    drawBgDecorations();
    drawBgParticles();

    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🦕 小勇士大冒险', W/2, 140);

    // Subtitle
    ctx.fillStyle = 'white';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('收集星星 ⭐ 躲避障碍 💥 闯过5关', W/2, 185);

    // Character preview
    ctx.save();
    ctx.translate(W/2, 250);
    ctx.scale(1.5, 1.5);
    // Simple character
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 26, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#81C784';
    ctx.beginPath();
    ctx.ellipse(0, 6, 15, 18, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-8, -8, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -8, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-6, -7, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -7, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-8, -9, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -9, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 5, 9, 0.15, Math.PI - 0.15);
    ctx.stroke();
    ctx.restore();

    // Start button
    const btnW = 200, btnH = 55, btnX = W/2 - btnW/2, btnY = 295;
    const pulse = Math.sin(Date.now() * 0.004) * 5;
    ctx.fillStyle = '#FF6B35';
    ctx.beginPath();
    ctx.roundRect(btnX - 2, btnY - 2, btnW + 4, btnH + 4, 30);
    ctx.fill();
    ctx.fillStyle = '#FF8C42';
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 28);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 28px Arial';
    ctx.fillText('🎮 开始游戏', W/2, btnY + 38);

    // Instructions
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '16px Arial';
    ctx.fillText('按 空格键 或 点击屏幕 跳跃', W/2, 390);
    ctx.fillText('❤️×5 条命 | ⭐收集星星过关', W/2, 415);
  }

  function drawLevelCompleteScreen() {
    // Celebration background
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);

    // Confetti burst
    const cx = W/2, cy = H/2;
    const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF8C42', '#C77DFF'];
    for (let i = 0; i < 40; i++) {
      const angle = (i / 40) * Math.PI * 2 + stateTimer * 0.05;
      const dist = 30 + stateTimer * 3 + Math.sin(i * 7) * 20;
      const px = cx + Math.cos(angle) * dist;
      const py = cy + Math.sin(angle) * dist - stateTimer * 1.5;
      ctx.fillStyle = colors[i % colors.length];
      ctx.fillRect(px - 4, py - 4, 8, 8);
    }

    // Text
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 42px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🌟 太棒了！🌟', cx, cy - 20);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 22px Arial';
    ctx.fillText(`第 ${currentLevel + 1} 关 通关！`, cx, cy + 30);

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '18px Arial';
    const nextName = currentLevel + 1 < LEVELS.length ? LEVELS[currentLevel + 1].name : '🏆';
    ctx.fillText(`准备进入 ${nextName}...`, cx, cy + 65);

    // Stars display
    for (let i = 0; i < level.starTarget; i++) {
      ctx.fillText('⭐', cx - level.starTarget * 15 + i * 30, cy + 100);
    }
  }

  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#FF6B6B';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('😢 哎呀！', W/2, 160);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 22px Arial';
    ctx.fillText(`你到达了第 ${currentLevel + 1} 关`, W/2, 210);
    ctx.fillText(`得分: ${score}`, W/2, 245);

    // Retry button
    const btnW = 200, btnH = 50, btnX = W/2 - btnW/2, btnY = 280;
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 28);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('🔄 再来一次', W/2, btnY + 35);

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '16px Arial';
    ctx.fillText('按空格键或点击重试', W/2, 360);
  }

  function drawVictoryScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);

    // Fireworks particles
    const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF8C42', '#C77DFF', '#FF69B4'];
    for (let i = 0; i < 60; i++) {
      const t = stateTimer * 0.03 + i * 0.5;
      const cx = W/2 + Math.cos(t) * (80 + Math.sin(i) * 50);
      const cy = 100 + Math.sin(t * 0.7) * (60 + Math.cos(i) * 40);
      const sz = 3 + Math.sin(t * 2 + i) * 2;
      ctx.fillStyle = colors[i % colors.length];
      ctx.beginPath();
      ctx.arc(cx, cy + Math.sin(t * 0.5) * 30, Math.abs(sz), 0, Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 50px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🏆 你赢了！🏆', W/2, 130);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('全部5关通关！', W/2, 175);
    ctx.fillText(`最终得分: ${score}`, W/2, 215);

    // Trophy character
    ctx.font = '80px Arial';
    ctx.fillText('🦕👑', W/2, 290);

    // Restart button
    const btnW = 200, btnH = 50, btnX = W/2 - btnW/2, btnY = 310;
    ctx.fillStyle = '#FF8C42';
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 28);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('🎮 再玩一次', W/2, btnY + 35);

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '16px Arial';
    ctx.fillText('按空格键或点击重新开始', W/2, 390);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // Apply screen shake
    ctx.save();
    if (shakeTimer > 0) {
      const sx = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 20);
      const sy = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 20);
      ctx.translate(sx, sy);
    }

    if (gameState === STATE.MENU) {
      drawMenuScreen();
      ctx.restore();
      return;
    }

    // Background
    drawSky();
    drawBgDecorations();
    drawBgParticles();
    drawGround();

    // Game objects
    stars.forEach(s => drawStar(s));
    obstacles.forEach(o => drawObstacle(o));
    drawPlayer();
    drawParticles();

    ctx.restore();

    // HUD (no shake)
    if (gameState === STATE.PLAYING) {
      drawHUD();
    }

    // Overlay screens
    if (gameState === STATE.LEVEL_COMPLETE) {
      drawLevelCompleteScreen();
    } else if (gameState === STATE.GAME_OVER) {
      drawGameOverScreen();
    } else if (gameState === STATE.VICTORY) {
      drawVictoryScreen();
    }
  }

  // --- Game Loop ---
  function gameLoop() {
    update();
    render();

    // Blink occasionally
    if (Math.random() < 0.005) player.eyeBlink = 8;
    if (player.eyeBlink > 0) player.eyeBlink--;

    // Show/hide hint
    if (gameState === STATE.PLAYING) {
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
    }

    requestAnimationFrame(gameLoop);
  }

  // --- Init ---
  level = LEVELS[0];
  initBgParticles();
  gameLoop();

  console.log('🦕 小勇士大冒险 准备好了！');
  console.log('按空格键或点击屏幕开始游戏');
  console.log('5个关卡等你来挑战！');
})();
</script>
