  function loadCharacterPhotos() {
    for (const [expr, b64] of Object.entries(CHAR_PHOTOS_B64)) {
      const img = new Image();
      img.onload = () => console.log(`📷 ${expr} 照片已加载`);
      img.onerror = () => console.log(`📷 ${expr} 照片加载失败`);
      img.src = b64;
      charPhotos.push(img);
    }
    // Fill remaining slots with same photos for different frames
    while (charPhotos.length < 10) {
      charPhotos.push(charPhotos[charPhotos.length % 3]);
    }
  }
  loadCharacterPhotos();

  function resize() {
    const container = document.getElementById('game-container');
    const maxW = Math.min(window.innerWidth, 800);
    const maxH = window.innerHeight;
    scale = Math.min(maxW / W, maxH / H);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ─── Audio System ────────────────────────────
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(freq, type, duration, vol = 0.1, glideTo = null) {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t + duration);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + duration);
    } catch(e) {}
  }

  function sfxCorrect() {
    [523, 659, 784].forEach((f, i) =>

      { name: '🌈 彩虹云端', skyTop: '#E1BEE7', skyBot: '#FFF9C4', groundColor: '#CE93D8', groundDark: '#AB47BC', decor: 'rainbow' },
      { name: '🦋 蝴蝶花园', skyTop: '#C5E1A5', skyBot: '#F1F8E9', groundColor: '#81C784', groundDark: '#4CAF50', decor: 'garden' },
      { name: '🎪 快乐马戏团', skyTop: '#FFCC80', skyBot: '#FFF8E1', groundColor: '#FFAB40', groundDark: '#FF9100', decor: 'circus' },
      { name: '👑 终极城堡', skyTop: '#FFD54F', skyBot: '#FFF8E1', groundColor: '#FF6F00', groundDark: '#E65100', decor: 'castle' },
    ];

    LEVELS.push({
      maxNum: maxNum,
      ops: ops,
      theme: themes[i],
      starsNeeded: 3,
      difficulty: i + 1,
    });
  }

  // ─── Initialize Background Stars ─────────────
  function initBgStars() {
    bgStars = [];
    for (let i = 0; i < 50; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.7,
        size: Math.random() * 2.5 + 0.5,
        twinkle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.01,
      });
    }
  }
  initBgStars();

  // ─── Question Generator ─────────────────────
  function generateQuestion() {
    const level = LEVELS[currentLevel];
    const ops = level.ops;
    const op = ops[Math.floor(Math.random() * ops.length)];

    let a, b, answer;
    if (op === '+') {
      // Addition: ensure answer within maxNum, both numbers >= 1
      answer = Math.floor(Math.random() * (level.maxNum - 1)) + 2; // 2..maxNum
      a = Math.floor(Math.random() * (answer - 1)) + 1; // 1..answer-1
      b = answer - a;
      if (b < 1) { b = 1; a = answer - 1; }
      answer = a + b;
    } else {
      // Subtraction: a - b = answer within maxNum, both >= 1
      a = Math.floor(Math.random() * level.maxNum) + 2; // 2..maxNum+1
      if (a > level.maxNum) a = level.maxNum;
      b = Math.floor(Math.random() * (a - 1)) + 1; // 1..a-1
      answer = a - b;
      // Ensure answer is >= 0 (always true since b < a)
    }

    correctAnswer = answer;

    // Generate wrong answers — close distractors for learning
    const wrongAnswers = new Set();
    wrongAnswers.add(answer);
    // Try nearby numbers first (+1, -1, +2, -2), then fill with random
    const nearbyOffsets = [1, -1, 2, -2, 3, -3];
    for (const offset of nearbyOffsets) {
      if (wrongAnswers.size >= 4) break;
      const w = answer + offset;
      if (w >= 0 && w <= 20 && w !== answer) {
        wrongAnswers.add(w);
      }
    }
    // Fill remaining slots
    while (wrongAnswers.size < 4) {
      const w = Math.floor(Math.random() * (level.maxNum + 1));
      if (w !== answer) wrongAnswers.add(w);
    }

    answers = Array.from(wrongAnswers);
    // Shuffle
    for (let i = answers.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [answers[i], answers[j]] = [answers[j], answers[i]];
    }

    currentQuestion = { a, b, op, answer };
    selectedAnswer = -1;
  }

  // ─── Game Flow ──────────────────────────────
  function startGame(fromLevel) {
    initAudio();
    gameState = STATE.PLAYING;
    currentLevel = fromLevel || 0;
    questionIndex = 0;
    score = fromLevel ? score : 0;
    stars = fromLevel ? stars : 0;
    lives = fromLevel ? 3 : 5;
    charY = 0;
    charRotate = 0;
    charScale = 1;
    charExpression = 'happy';
    particles = [];
    confetti = [];
    shakeAmount = 0;
    stateTimer = 0;
    generateQuestion();
  }

  function nextQuestion() {
    questionIndex++;
    if (questionIndex >= QUESTIONS_PER_LEVEL) {
      // Level complete!
      gameState = STATE.LEVEL_COMPLETE;
      stateTimer = 0;
      stars++;
      score += 10;
      sfxLevelUp();
      spawnConfetti(W/2, H/2, 60);
      if (currentLevel >= TOTAL_LEVELS - 1) {
        gameState = STATE.VICTORY;
        stateTimer = 0;
        sfxWin();
        spawnConfetti(W/2, H/2, 80);
      }
    } else {
      gameState = STATE.PLAYING;
      generateQuestion();
      charExpression = 'happy';
      charBounce = -8;
    }
  }

  function selectAnswer(idx) {
    if (gameState !== STATE.PLAYING) return;
    initAudio();
    sfxClick();
    selectedAnswer = idx;

    if (answers[idx] === correctAnswer) {
      // Correct!
      gameState = STATE.CORRECT;
      stateTimer = 0;
      score += 2;
      charExpression = 'excited';
      charJumpVel = -12;
      sfxCorrect();
      spawnParticles(W * 0.25, H * 0.4, '#FFD700', 20);
      spawnParticles(W * 0.25, H * 0.4, '#4CAF50', 15);
    } else {
      // Wrong
      gameState = STATE.WRONG;
      stateTimer = 0;
      lives--;
      charExpression = 'sad';
      shakeAmount = 6;
      sfxWrong();
      // Highlight correct answer
    }
  }

  function checkStateTransition() {
    if (gameState === STATE.CORRECT) {
      stateTimer++;
      if (stateTimer > 70) {
        nextQuestion();
      }
    }
    if (gameState === STATE.WRONG) {
      stateTimer++;
      if (stateTimer > 80) {
        if (lives <= 0) {
          gameState = STATE.GAME_OVER;
          stateTimer = 0;
        } else {
          // Try again same question
          gameState = STATE.PLAYING;
          selectedAnswer = -1;
          charExpression = 'happy';
        }
      }
    }
    if (gameState === STATE.LEVEL_COMPLETE) {
      stateTimer++;
      if (stateTimer > 120 && currentLevel < TOTAL_LEVELS - 1) {
        currentLevel++;
        questionIndex = 0;
        gameState = STATE.PLAYING;
        charExpression = 'happy';
        generateQuestion();
      }
    }
  }

  // ─── Particle Systems ───────────────────────
  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        life: 40 + Math.random() * 30,
        maxLife: 70,
        color,
        size: Math.random() * 5 + 3,
      });
    }
  }

  function spawnConfetti(x, y, count) {
    const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF8C42', '#C77DFF', '#FF69B4', '#00D2FF'];
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI;
      const speed = Math.random() * 10 + 5;
      confetti.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 60 + Math.random() * 60,
        maxLife: 120,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 8 + 4,
        rotate: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.2,
        shape: Math.random() < 0.5 ? 'rect' : 'circle',
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.1;
      c.vx *= 0.99;
      c.rotate += c.rotSpeed;
      c.life--;
      if (c.life <= 0) confetti.splice(i, 1);
    }
    for (const s of bgStars) {
      s.twinkle += s.speed;
    }
  }

  function drawParticles(ctx) {
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    for (const c of confetti) {
      const alpha = c.life / c.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rotate);
      ctx.fillStyle = c.color;
      if (c.shape === 'rect') {
        ctx.fillRect(-c.size * 0.6, -c.size * 0.3, c.size * 1.2, c.size * 0.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, c.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ─── Drawing Functions ──────────────────────
  function drawBackground() {
    const level = LEVELS[currentLevel];
    const theme = level.theme;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.skyTop);
    grad.addColorStop(1, theme.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Background stars (for space theme or general sparkle)
    if (theme.decor === 'space') {
      for (const s of bgStars) {
        const alpha = 0.4 + Math.sin(s.twinkle) * 0.4;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Ground
    const groundY = H - 110;
    const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
    groundGrad.addColorStop(0, theme.groundColor);
    groundGrad.addColorStop(0.05, theme.groundDark);
    groundGrad.addColorStop(1, theme.groundDark);
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, groundY, W, H - groundY);

    // Ground detail line
    ctx.fillStyle = theme.groundDark;
    ctx.fillRect(0, groundY, W, 5);

    // Decorative elements per theme
    drawThemeDecorations(theme, groundY);

    // Clouds
    drawClouds(groundY);
  }

  function drawClouds(groundY) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    const clouds = [
      { x: 100 + Math.sin(frameCount * 0.005) * 20, y: 60, s: 1.0 },
      { x: 350 + Math.cos(frameCount * 0.004) * 15, y: 85, s: 0.7 },
      { x: 600 + Math.sin(frameCount * 0.006) * 25, y: 40, s: 1.2 },
    ];
    for (const c of clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 25 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 25 * c.s, c.y - 10 * c.s, 20 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 45 * c.s, c.y + 5 * c.s, 22 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 15 * c.s, c.y + 8 * c.s, 18 * c.s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawThemeDecorations(theme, groundY) {
    if (theme.decor === 'spring') {
      // Flowers
      for (let i = 0; i < 12; i++) {
        const fx = 40 + i * 65 + Math.sin(i * 1.5) * 10;
        const fy = groundY - 5;
        drawFlower(fx, fy, ['#FF6B9D', '#FFD700', '#FF9F43', '#FF6FB7'][i % 4], 8);
      }
    } else if (theme.decor === 'grassland') {
      // Tall grass + sun
      for (let i = 0; i < 20; i++) {
        const gx = i * 42;
        ctx.fillStyle = i % 3 === 0 ? '#7CB342' : '#9CCC65';
        ctx.fillRect(gx, groundY - 15 - (i % 3) * 10, 3, 15 + (i % 3) * 10);
      }
      // Sun
      ctx.fillStyle = '#FFE082';
      ctx.beginPath();
      ctx.arc(680, 80, 50, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF9C4';
      ctx.beginPath();
      ctx.arc(680, 80, 35, 0, Math.PI * 2);
      ctx.fill();
    } else if (theme.decor === 'autumn') {
      // Trees with colored leaves
      for (let i = 0; i < 5; i++) {
        const tx = 80 + i * 160;
        ctx.fillStyle = '#795548';
        ctx.fillRect(tx - 6, groundY - 60, 12, 60);
        ['#FF7043', '#FFCA28', '#FF8A65', '#D4E157'].forEach((color, j) => {
          ctx.fillStyle = color;
          const lx = tx + (j - 1.5) * 25 + Math.sin(j * 2) * 10;
          const ly = groundY - 75 - j * 15;
          ctx.beginPath();
          ctx.arc(lx, ly, 18, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    } else if (theme.decor === 'beach') {
      // Waves
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (let i = 0; i < 6; i++) {
        const wy = groundY + 15 + i * 8;
        ctx.beginPath();
        ctx.moveTo(0, wy);
        for (let x = 0; x < W; x += 5) {
          ctx.lineTo(x, wy + Math.sin(x * 0.02 + frameCount * 0.03 + i) * 5);
        }
        ctx.lineTo(W, wy + 20);
        ctx.lineTo(0, wy + 20);
        ctx.fill();
      }
      // Shells
      for (let i = 0; i < 8; i++) {
        const sx = 50 + i * 90 + Math.sin(i * 3) * 20;
        const sy = groundY + 30 + Math.cos(i * 2) * 10;
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, Math.PI);
        ctx.fill();
      }
    } else if (theme.decor === 'snow') {
      // Snowflakes
      for (const s of bgStars) {
        if (s.y < groundY) {
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.beginPath();
          ctx.arc(
            (s.x + frameCount * 0.2) % W,
            (s.y + frameCount * 0.3) % groundY,
            s.size * 1.5, 0, Math.PI * 2
          );
          ctx.fill();
        }
      }
      // Snow ground
      ctx.fillStyle = '#F5F5F5';
      for (let i = 0; i < 10; i++) {
        const hx = i * 80 + 20 + Math.sin(i * 1.8) * 15;
        const hh = 15 + Math.sin(i * 2.5) * 10;
        ctx.beginPath();
        ctx.arc(hx, groundY, 35 + hh, Math.PI, Math.PI * 2);
        ctx.fill();
      }
    } else if (theme.decor === 'space') {
      // Planet
      ctx.fillStyle = '#7C4DFF';
      ctx.beginPath();
      ctx.arc(650, 90, 45, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(640, 75, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,180,255,0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(650, 90, 65, 18, -0.3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;
    } else if (theme.decor === 'rainbow') {
      // Rainbow
      const colors = ['#FF6B6B', '#FFAB40', '#FFD740', '#69F0AE', '#40C4FF', '#7C4DFF'];
      for (let i = colors.length - 1; i >= 0; i--) {
        ctx.strokeStyle = colors[i];
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(W/2, groundY, 180 + i * 10, Math.PI, 0);
        ctx.stroke();
      }
      ctx.lineWidth = 1;
    } else if (theme.decor === 'garden') {
      // Butterflies (simplified)
      for (let i = 0; i < 6; i++) {
        const bx = (100 + i * 120 + Math.sin(frameCount * 0.02 + i) * 40);
        const by = 80 + Math.cos(frameCount * 0.03 + i) * 30;
        ctx.fillStyle = ['#FF80AB', '#B388FF', '#80D8FF', '#FFE57F', '#FF8A80', '#B9F6CA'][i];
        ctx.beginPath();
        ctx.ellipse(bx - 6, by, 8, 5, -0.5, 0, Math.PI * 2);
        ctx.ellipse(bx + 6, by, 8, 5, 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      // Flowers
      for (let i = 0; i < 15; i++) {
        drawFlower(30 + i * 55, groundY - 3, ['#FF4081', '#FFD740', '#7C4DFF', '#18FFFF'][i % 4], 7);
      }
    } else if (theme.decor === 'circus') {
      // Tent stripes
      for (let i = 0; i < 12; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#FF5252' : '#FFF';
        ctx.fillRect(550 + i * 18, 20, 18, 200);
      }
      // Tent top
      ctx.fillStyle = '#FFD740';
      ctx.beginPath();
      ctx.moveTo(550, 20);
      ctx.lineTo(650, 15);
      ctx.lineTo(766, 20);
      ctx.lineTo(766, 100);
      ctx.quadraticCurveTo(658, 90, 550, 100);
      ctx.fill();
      // Bunting
      for (let i = 0; i < 16; i++) {
        const bx = i * 50 + 20;
        const by = 30;
        ctx.fillStyle = ['#FF5252', '#FFD740', '#448AFF', '#69F0AE'][i % 4];
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + 25, by + 20);
        ctx.lineTo(bx - 25, by + 20);
        ctx.fill();
      }
    } else if (theme.decor === 'castle') {
      // Castle walls
      ctx.fillStyle = '#BDBDBD';
      for (let i = 0; i < 8; i++) {
        const cx = 100 + i * 85;
        ctx.fillRect(cx - 18, groundY - 80, 36, 80);
        // Battlement
        ctx.fillRect(cx - 22, groundY - 90, 44, 15);
        ctx.fillStyle = '#9E9E9E';
        ctx.fillRect(cx - 18, groundY - 75, 36, 5);
        ctx.fillStyle = '#BDBDBD';
      }
      // Flags
      for (let i = 0; i < 8; i++) {
        const cx = 100 + i * 85;
        ctx.fillStyle = ['#FF5252', '#448AFF', '#FFD740'][i % 3];
        ctx.beginPath();
        ctx.moveTo(cx, groundY - 95);
        ctx.lineTo(cx + 15, groundY - 85);
        ctx.lineTo(cx, groundY - 75);
        ctx.fill();
      }
    }
  }

  function drawFlower(x, y, color, size) {
    for (let p = 0; p < 5; p++) {
      ctx.fillStyle = color;
      ctx.beginPath();
      const a = (p / 5) * Math.PI * 2;
      ctx.arc(x + Math.cos(a) * size * 0.5, y + Math.sin(a) * size * 0.5, size * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#FFD740';
    ctx.beginPath();
    ctx.arc(x, y, size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  // ─── Character Drawing (Real Photo + Body) ──
  function drawCharacter() {
    const cx = W * 0.23;
    const cy = H - 110 - 80 + charY + Math.sin(frameCount * 0.08) * 3;
    const bounceY = charBounce > 0 ? charBounce : 0;
    const charSize = 140; // total character height area

    ctx.save();
    ctx.translate(cx, cy + bounceY);
    ctx.rotate(charRotate * Math.PI / 180);
    ctx.scale(charScale, charScale);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(0, 72, 35, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Check if we have a real photo to use (0=happy, 1=excited, 2=sad, then repeats)
    const photoIdx = charExpression === 'excited' ? 1 : charExpression === 'sad' ? 2 : 0;
    const photo = charPhotos[photoIdx];
    const usePhoto = photo && photo.complete && photo.naturalWidth > 0;

    if (usePhoto) {
      // ── Real photo as the full character ──
      // Draw the standing platform
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 68, 38, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Draw photo in a rounded-rect frame (like a photo card)
      const pw = 76, ph = 100;
      const px = -pw/2, py = -ph + 26;

      // Photo frame shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.roundRect(px + 3, py + 3, pw, ph, 18);
      ctx.fill();

      // White photo border
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.roundRect(px, py, pw, ph, 18);
      ctx.fill();

      // Clip to rounded rect for the photo
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(px + 4, py + 4, pw - 8, ph - 8, 14);
      ctx.closePath();
      ctx.clip();

      // Draw the photo - scale to fill the frame
      ctx.drawImage(photo, px + 4, py + 4, pw - 8, ph - 8);

      ctx.restore();

      // Photo frame border
      ctx.strokeStyle = '#FF6B6B';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(px, py, pw, ph, 18);
      ctx.stroke();
      ctx.lineWidth = 1;

      // Decorative stars around photo
      if (charExpression === 'excited') {
        const starEmojis = ['⭐', '✨', '🌟'];
        for (let i = 0; i < 3; i++) {
          const sx = -40 + i * 40 + Math.sin(frameCount * 0.1 + i) * 8;
          const sy = -ph + 10 + Math.cos(frameCount * 0.08 + i) * 5;
          ctx.font = '18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(starEmojis[i], sx, sy);
        }
      }

      // Small legs/shoes at bottom for cute effect
      if (charExpression !== 'sad') {
        ctx.fillStyle = '#FF6B6B';
        ctx.beginPath();
        ctx.ellipse(-14, 68, 9, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(14, 68, 9, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Expression indicator
      if (charExpression === 'sad') {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.roundRect(px, py, pw, ph, 18);
        ctx.fill();
      }

    } else {
      // ── Fallback: Canvas-drawn cute character ──
      drawCanvasCharacter(ctx);
    }

    ctx.restore();
  }

  function drawCanvasCharacter(ctx) {
    // ── Shoes ──
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath();
    ctx.ellipse(-16, 62, 12, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(16, 62, 12, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(-16, 60, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(16, 60, 4, 0, Math.PI * 2);
    ctx.fill();

    // ── Legs ──
    ctx.fillStyle = '#FFD54F';
    ctx.fillRect(-20, 42, 14, 22);
    ctx.fillRect(6, 42, 14, 22);
    ctx.fillStyle = '#FFF';
    ctx.fillRect(-20, 56, 14, 8);
    ctx.fillRect(6, 56, 14, 8);

    // ── Body / Dress ──
    ctx.fillStyle = '#42A5F5';
    ctx.beginPath();
    ctx.moveTo(-26, 12);
    ctx.quadraticCurveTo(-30, 42, -22, 50);
    ctx.lineTo(22, 50);
    ctx.quadraticCurveTo(30, 42, 26, 12);
    ctx.fill();
    ctx.fillStyle = '#1E88E5';
    ctx.fillRect(-24, 24, 48, 3);
    ctx.fillRect(-23, 32, 46, 3);
    ctx.fillRect(-22, 40, 44, 3);

    // ── Arms ──
    ctx.fillStyle = '#FFD54F';
    const armWave = charExpression === 'excited' ? Math.sin(frameCount * 0.3) * 25 : 0;
    ctx.save();
    ctx.translate(-26, 18);
    ctx.rotate(-0.3 + armWave * 0.02);
    ctx.fillRect(-6, -4, 10, 30);
    ctx.fillStyle = '#FFD54F';
    ctx.beginPath();
    ctx.arc(-1, 26, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(26, 18);
    ctx.rotate(0.3);
    ctx.fillRect(-4, -4, 10, 30);
    ctx.fillStyle = '#FFD54F';
    ctx.beginPath();
    ctx.arc(1, 26, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ── Head ──
    ctx.fillStyle = '#FFD54F';
    ctx.beginPath();
    ctx.arc(0, -8, 28, 0, Math.PI * 2);
    ctx.fill();

    // ── Hair ──
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(0, -12, 30, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-28, -14, 8, 18);
    ctx.fillRect(20, -14, 8, 18);
    ctx.beginPath();
    ctx.arc(-10, -28, 10, Math.PI * 0.1, Math.PI * 0.7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(10, -28, 10, Math.PI * 0.3, Math.PI * 0.9);
    ctx.fill();
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(0, -16, 18, Math.PI, 0);
    ctx.fill();

    // ── Face ──
    const eyeY = -10;
    let eyeH = 10;
    if (isBlinking) eyeH = 1;
    if (charExpression === 'sad') eyeH = 8;
    if (charExpression === 'excited') eyeH = 12;

    if (charExpression === 'sad') {
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.ellipse(-10, eyeY, 8, eyeH, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(10, eyeY, 8, eyeH, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-9, eyeY + 2, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(11, eyeY + 2, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-18, eyeY - 11); ctx.lineTo(-5, eyeY - 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(18, eyeY - 11); ctx.lineTo(5, eyeY - 7); ctx.stroke();
      ctx.lineWidth = 1;
    } else if (charExpression === 'excited') {
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.ellipse(-10, eyeY, 8, eyeH, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(10, eyeY, 8, eyeH, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-11, eyeY - 1, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(9, eyeY - 1, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(-13, eyeY - 4, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(7, eyeY - 4, 3, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.ellipse(-10, eyeY, 8, eyeH, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(10, eyeY, 8, eyeH, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(-8, eyeY, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, eyeY, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(-10, eyeY - 3, 1.8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(10, eyeY - 3, 1.8, 0, Math.PI*2); ctx.fill();
    }

    if (!isBlinking) {
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 1;
      for (const side of [-10, 10]) {
        ctx.beginPath();
        ctx.moveTo(side - 6, eyeY - eyeH - 1);
        ctx.lineTo(side - 8, eyeY - eyeH - 5);
        ctx.stroke();
      }
      ctx.lineWidth = 1;
    }

    // ── Rosy cheeks ──
    ctx.fillStyle = 'rgba(255, 130, 130, 0.5)';
    ctx.beginPath(); ctx.ellipse(-18, 6, 7, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18, 6, 7, 4, 0, 0, Math.PI*2); ctx.fill();

    // ── Mouth ──
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    if (charExpression === 'sad') {
      ctx.beginPath();
      ctx.arc(0, 20, 8, 0.15, Math.PI - 0.15, true);
      ctx.stroke();
    } else if (charExpression === 'excited') {
      ctx.fillStyle = '#E57373';
      ctx.beginPath(); ctx.ellipse(0, 12, 8, 7, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FF8A80';
      ctx.beginPath(); ctx.ellipse(0, 10, 6, 3, 0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 8, 10, 0.15, Math.PI - 0.15);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';

    // ── Nose ──
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    ctx.arc(0, 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // ─── Question Display ───────────────────────
  function drawQuestion() {
    if (!currentQuestion) return;

    const qy = H - 100;
    const qx = W * 0.6;

    // Question bubble background
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.roundRect(qx - 160, qy - 200, 320, 85, 25);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Question mark decoration
    ctx.fillStyle = '#FF6B6B';
    ctx.font = '30px "Comic Sans MS", "KaiTi", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('🤔', qx - 145, qy - 155);

    // Question text
    ctx.fillStyle = '#333';
    ctx.font = 'bold 38px "Comic Sans MS", "KaiTi", "STKaiti", sans-serif';
    ctx.textAlign = 'center';
    const questionText = `${currentQuestion.a} ${currentQuestion.op} ${currentQuestion.b} = ?`;
    ctx.fillText(questionText, qx, qy - 150);

    // Birds carrying the problem (decorative)
    const birdPhase = Math.sin(frameCount * 0.04) * 8;
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🐦', qx - 180, qy - 175 + birdPhase);
    ctx.fillText('🐦', qx + 170, qy - 175 - birdPhase);
  }

  function drawAnswerButtons() {
    if (!answers.length || gameState === STATE.MENU) return;

    const qy = H - 100;
    const qx = W * 0.6;
    const btnW = 115, btnH = 70;
    const startX = qx - 195;
    const startY = qy - 95;

    for (let i = 0; i < 4; i++) {
      const bx = startX + i * 105;
      const by = startY;

      let isSelected = (i === selectedAnswer);
      let isCorrect = (answers[i] === correctAnswer);
      let showCorrect = (gameState === STATE.WRONG && isCorrect);

      // Button color
      let btnColor, btnColorLight, btnColorDark;
      if (showCorrect) {
        btnColor = '#4CAF50';
        btnColorLight = '#66BB6A';
        btnColorDark = '#388E3C';
      } else if (isSelected && gameState === STATE.WRONG) {
        btnColor = '#FF5252';
        btnColorLight = '#FF6B6B';
        btnColorDark = '#D32F2F';
      } else {
        const palette = ['#FF6B6B', '#4D96FF', '#FF8C42', '#6BCB77'];
        btnColor = palette[i];
        btnColorLight = palette[i];
        btnColorDark = palette[i];
      }

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.roundRect(bx - 2, by + 3, btnW + 4, btnH + 2, 20);
      ctx.fill();

      // Button body
      const btnGrad = ctx.createLinearGradient(bx, by, bx, by + btnH);
      btnGrad.addColorStop(0, btnColorLight);
      btnGrad.addColorStop(1, btnColor);
      ctx.fillStyle = btnGrad;
      ctx.beginPath();
      ctx.roundRect(bx, by, btnW, btnH, 20);
      ctx.fill();

      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.roundRect(bx + 4, by + 4, btnW - 8, btnH * 0.4, 14);
      ctx.fill();

      // Border
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(bx, by, btnW, btnH, 20);
      ctx.stroke();
      ctx.lineWidth = 1;

      // Number
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 32px "Comic Sans MS", "KaiTi", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const numText = showCorrect ? `✓ ${answers[i]}` : String(answers[i]);
      ctx.fillText(numText, bx + btnW/2, by + btnH/2);

      // Emoji decorations on buttons
      const emojis = ['🌟', '🎈', '🦋', '🌸'];
      ctx.font = '14px sans-serif';
      ctx.fillText(emojis[i], bx + btnW/2, by - 5);
    }
  }

  // ─── HUD ────────────────────────────────────
  function drawHUD() {
    const level = LEVELS[currentLevel];

    // Top bar background
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.roundRect(15, 12, 770, 52, 20);
    ctx.fill();

    // Level indicator
    ctx.fillStyle = '#FF6B6B';
    ctx.font = 'bold 20px "KaiTi", "STKaiti", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`🎯 第${currentLevel + 1}关 · ${level.theme.name}`, 30, 38);

    // Progress dots
    for (let i = 0; i < QUESTIONS_PER_LEVEL; i++) {
      const dx = 530 + i * 32;
      ctx.fillStyle = i < questionIndex ? '#4CAF50' : '#E0E0E0';
      ctx.strokeStyle = '#BDBDBD';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(dx, 38, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (i < questionIndex) {
        ctx.fillStyle = '#FFF';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✓', dx, 41);
      }
    }

    // Score
    ctx.fillStyle = '#FF8C42';
    ctx.font = 'bold 18px "KaiTi", "STKaiti", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`⭐ ${score} 分`, W - 120, 38);

    // Lives (hearts)
    for (let i = 0; i < 5; i++) {
      const hx = W - 28 - i * 30;
      drawHeart(hx, 32, i < lives);
    }
  }

  function drawHeart(x, y, filled) {
    ctx.save();
    ctx.translate(x, y);
    const s = 10;
    ctx.fillStyle = filled ? '#FF5252' : '#E0E0E0';
    ctx.beginPath();
    ctx.moveTo(0, s * 0.3);
    ctx.bezierCurveTo(0, -s * 0.3, -s, -s * 0.3, -s, s * 0.3);
    ctx.bezierCurveTo(-s, s * 0.9, 0, s * 1.3, 0, s * 1.3);
    ctx.bezierCurveTo(0, s * 1.3, s, s * 0.9, s, s * 0.3);
    ctx.bezierCurveTo(s, -s * 0.3, 0, -s * 0.3, 0, s * 0.3);
    ctx.fill();
    ctx.restore();
  }

  // ─── Menu Screen ────────────────────────────
  function drawMenuScreen() {
    // Use first level's theme for background
    const theme = LEVELS[0].theme;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.skyTop);
    grad.addColorStop(1, theme.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Pink overlay
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(0, 0, W, H);

    // Floating decorations
    for (let i = 0; i < 20; i++) {
      const fx = (i * 42 + frameCount * 0.3) % (W + 100) - 50;
      const fy = 100 + Math.sin(i * 2.5 + frameCount * 0.02) * 60;
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(['⭐','🌸','🦋','🎈','🌟','🍎','🎀','💎'][i % 8], fx, fy);
    }

    // Title card
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.roundRect(W/2 - 280, 60, 560, 420, 35);
    ctx.fill();
    ctx.strokeStyle = '#FF6B6B';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(W/2 - 280, 60, 560, 420, 35);
    ctx.stroke();
    ctx.lineWidth = 1;

    // Title
    ctx.fillStyle = '#FF6B6B';
    ctx.font = 'bold 48px "KaiTi", "STKaiti", "Comic Sans MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🧮 数学大冒险 🧮', W/2, 145);

    // Subtitle
    ctx.fillStyle = '#666';
    ctx.font = 'bold 22px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText('50以内加减法闯关游戏', W/2, 190);

    // Draw cute character preview
    ctx.save();
    ctx.translate(W/2, 310);
    ctx.scale(1.4, 1.4);
    // Simplified character
    drawMiniCharacter(ctx);
    ctx.restore();

    // Decorative math symbols
    ctx.fillStyle = '#FF8C42';
    ctx.font = 'bold 30px "Comic Sans MS", sans-serif';
    ctx.fillText('2 + 3 = 5', W/2 - 170, 250);
    ctx.fillStyle = '#4D96FF';
    ctx.fillText('8 - 3 = 5', W/2 + 170, 250);

    // Start button
    const btnW = 260, btnH = 65, btnX = W/2 - btnW/2, btnY = 370;
    const pulse = Math.sin(Date.now() * 0.005) * 4;

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.roundRect(btnX + 2, btnY + 4, btnW, btnH, 35);
    ctx.fill();

    const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
    btnGrad.addColorStop(0, '#FF8C42');
    btnGrad.addColorStop(1, '#FF6B6B');
    ctx.fillStyle = btnGrad;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY + pulse, btnW, btnH, 35);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.roundRect(btnX + 6, btnY + 6 + pulse, btnW - 12, btnH * 0.4, 28);
    ctx.fill();

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 32px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText('🎮 开始冒险！', W/2, btnY + 42 + pulse);

    // Instructions
    ctx.fillStyle = '#999';
    ctx.font = '18px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText('🎯 10关闯关 · 每关5道题 · 50以内加减法', W/2, 465);
    ctx.fillText('💡 点击正确答案帮小朋友过关吧！', W/2, 492);
  }

  function drawMiniCharacter(ctx) {
    // Quick mini character for menu
    ctx.fillStyle = '#FFD54F';
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(0, -4, 26, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#42A5F5';
    ctx.fillRect(-22, 10, 44, 35);
    // Eyes
    ctx.fillStyle = '#FFF';
    ctx.beginPath(); ctx.arc(-9, -3, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -3, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-7, -2, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -2, 3.5, 0, Math.PI*2); ctx.fill();
    // Cheeks
    ctx.fillStyle = 'rgba(255,130,130,0.5)';
    ctx.beginPath(); ctx.arc(-16, 6, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, 6, 5, 0, Math.PI*2); ctx.fill();
    // Smile
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 5, 9, 0.1, Math.PI - 0.1);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // ─── Game Over Screen ───────────────────────
  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.93)';
    ctx.beginPath();
    ctx.roundRect(W/2 - 220, 130, 440, 300, 30);
    ctx.fill();

    ctx.fillStyle = '#FF6B6B';
    ctx.font = 'bold 38px "KaiTi", "STKaiti", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(lives <= 0 ? '😢 没生命啦！' : '💪 别灰心！', W/2, 195);

    ctx.fillStyle = '#333';
    ctx.font = 'bold 24px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText(`第 ${currentLevel + 1} 关 · 得分 ${score}`, W/2, 240);

    // Reassurance
    ctx.fillStyle = '#FF8C42';
    ctx.font = 'bold 20px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText('🔄 从当前关继续挑战！', W/2, 280);

    // Retry button
    const btnW = 230, btnH = 55, btnX = W/2 - btnW/2, btnY = 330;
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 30);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 26px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText('🔄 再来一次！', W/2, btnY + 37);

    ctx.font = '16px "KaiTi", "STKaiti", sans-serif';

  // ─── Victory Screen ─────────────────────────
  function drawVictoryScreen() {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(0, 0, W, H);

    // Golden glow
    const glowGrad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 350);
    glowGrad.addColorStop(0, 'rgba(255,215,0,0.5)');
    glowGrad.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.93)';
    ctx.beginPath();
    ctx.roundRect(W/2 - 240, 100, 480, 380, 35);
    ctx.fill();

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 50px "KaiTi", "STKaiti", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🏆 你赢啦！🏆', W/2, 175);

    ctx.fillStyle = '#333';
    ctx.font = 'bold 22px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText('全部10关通关！太厉害了！', W/2, 220);
    ctx.fillText(`最终得分: ${score} 分 · ${stars} 颗星`, W/2, 255);

    // Big trophy character
    ctx.font = '80px sans-serif';
    ctx.fillText('🎊👑🎊', W/2, 330);

    // Crown on character
    ctx.font = '60px sans-serif';
    ctx.fillText('👸', W/2, 350);

    // Restart
    const btnW = 230, btnH = 55, btnX = W/2 - btnW/2, btnY = 380;
    const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
    btnGrad.addColorStop(0, '#FF8C42');
    btnGrad.addColorStop(1, '#FF6B6B');
    ctx.fillStyle = btnGrad;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 30);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 26px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText('🎮 再玩一次！', W/2, btnY + 37);

    ctx.fillStyle = '#999';
    ctx.font = '16px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText('点击按钮或按空格键重新开始', W/2, 455);
  }

  // ─── Level Complete Screen ──────────────────
  function drawLevelCompleteScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.93)';
    ctx.beginPath();
    ctx.roundRect(W/2 - 200, 180, 400, 200, 30);
    ctx.fill();

    ctx.fillStyle = '#4CAF50';
    ctx.font = 'bold 36px "KaiTi", "STKaiti", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🌟 太棒了！🌟', W/2, 235);

    ctx.fillStyle = '#333';
    ctx.font = 'bold 22px "KaiTi", "STKaiti", sans-serif';
    ctx.fillText(`第 ${currentLevel + 1} 关 过关！`, W/2, 275);

    const nextLevel = currentLevel + 1;
    if (nextLevel < TOTAL_LEVELS) {
      ctx.fillStyle = '#FF8C42';
      ctx.font = '18px "KaiTi", "STKaiti", sans-serif';
      ctx.fillText(`准备进入 → ${LEVELS[nextLevel].theme.name}`, W/2, 310);
    }

    // Stars
    ctx.font = '30px sans-serif';
    ctx.fillText('⭐'.repeat(currentLevel + 1), W/2, 350);
  }

  // ─── Main Render ────────────────────────────
  function render() {
    ctx.clearRect(0, 0, W, H);

    if (gameState === STATE.MENU) {
      drawMenuScreen();
      return;
    }

    // Apply shake
    ctx.save();
    if (shakeAmount > 0.1) {
      const sx = (Math.random() - 0.5) * shakeAmount * 2;
      const sy = (Math.random() - 0.5) * shakeAmount * 2;
      ctx.translate(sx, sy);
    }

    drawBackground();
    drawParticles(ctx);

    if (gameState !== STATE.GAME_OVER && gameState !== STATE.VICTORY) {
      drawCharacter();
      drawQuestion();
      drawAnswerButtons();
    }

    ctx.restore();

    // HUD (no shake)
    if (gameState !== STATE.MENU) {
      drawHUD();
    }

    // Overlay screens
    if (gameState === STATE.LEVEL_COMPLETE) {
      drawLevelCompleteScreen();
    } else if (gameState === STATE.GAME_OVER) {
      drawGameOverScreen();
    } else if (gameState === STATE.VICTORY) {
      drawVictoryScreen();
    }

    // Responsive hint for wrong answer
    if (gameState === STATE.WRONG) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 22px "KaiTi", "STKaiti", sans-serif';
      ctx.textAlign = 'center';
      const hintY = H - 100 - 200 - 40;
      ctx.fillText('💪 没关系，看看正确答案再试一次！', W * 0.6, hintY);
    }

    if (gameState === STATE.CORRECT) {
      ctx.fillStyle = 'rgba(76,175,80,0.9)';
      ctx.font = 'bold 26px "KaiTi", "STKaiti", sans-serif';
      ctx.textAlign = 'center';
      const hintY = H - 100 - 200 - 40;
      const cheers = ['太棒了！🎉', '真聪明！🌟', '答对啦！👏', '你好厉害！💪', '完美！✨'];
      ctx.fillText(cheers[Math.floor(stateTimer / 15) % cheers.length], W * 0.6, hintY);
    }
  }

  // ─── Update ─────────────────────────────────
  function update() {
    frameCount++;

    // Shake decay
    if (shakeAmount > 0.01) {
      shakeAmount *= 0.85;
      if (shakeAmount < 0.3) shakeAmount = 0;
    }

    // Character physics
    if (charJumpVel !== 0) {
      charY += charJumpVel;
      charJumpVel += 0.6;
      if (charY >= 0) {
        charY = 0;
        charJumpVel = 0;
        sfxJump();
      }
    }

    // Bounce decay
    if (charBounce < 0) charBounce += 0.5;
    if (charBounce > 0) charBounce -= 0.5;
    if (Math.abs(charBounce) < 0.5) charBounce = 0;

    // Blink
    eyeBlinkTimer--;
    if (eyeBlinkTimer <= 0) {
      isBlinking = true;
      eyeBlinkTimer = 120 + Math.random() * 180;
      setTimeout(() => { isBlinking = false; }, 100);
    }

    // State transitions
    checkStateTransition();

    // Update particles
    updateParticles();
  }

  // ─── Game Loop ──────────────────────────────
  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  // ─── Input Handling ─────────────────────────
  function getClickPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / scale,
      y: (e.clientY - rect.top) / scale,
    };
  }

  function handleClick(e) {
    initAudio();

    if (gameState === STATE.MENU) {
      startGame();
      return;
    }
    if (gameState === STATE.GAME_OVER) {
      startGame(currentLevel); // Restart from current level, not from scratch
      return;
    }
    if (gameState === STATE.VICTORY) {
      startGame(0); // Full restart
      return;
    }
    if (gameState === STATE.LEVEL_COMPLETE && currentLevel >= TOTAL_LEVELS - 1) {
      if (stateTimer > 60) startGame(0);
      return;
    }
    if (gameState === STATE.LEVEL_COMPLETE) {
      // Skip to next level on click
      currentLevel++;
      questionIndex = 0;
      gameState = STATE.PLAYING;
      charExpression = 'happy';
      generateQuestion();
      return;
    }

    // Check answer button clicks
    if (gameState === STATE.PLAYING) {
      const pos = getClickPos(e.touches ? e.touches[0] : e);
      const qy = H - 100;
      const qx = W * 0.6;
      const btnW = 115, btnH = 70;
      const startX = qx - 195;
      const startY = qy - 95;

      for (let i = 0; i < 4; i++) {
        const bx = startX + i * 105;
        const by = startY;
        if (pos.x >= bx && pos.x <= bx + btnW && pos.y >= by && pos.y <= by + btnH) {
          selectAnswer(i);
          return;
        }
      }
    }
  }

  let lastTouchTime = 0;
  canvas.addEventListener('click', (e) => {
    // Prevent double-fire from touch → click
    if (Date.now() - lastTouchTime < 300) return;
    handleClick(e);
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    lastTouchTime = Date.now();
    handleClick(e);
  }, { passive: false });

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      initAudio();
      if (gameState === STATE.MENU) startGame(0);
      else if (gameState === STATE.GAME_OVER) startGame(currentLevel);
      else if (gameState === STATE.VICTORY) startGame(0);
    }
    // Number keys 1-4 for answers
    if (gameState === STATE.PLAYING && e.key >= '1' && e.key <= '4') {
      e.preventDefault();
      selectAnswer(parseInt(e.key) - 1);
    }
  });

  // ─── Initialize ─────────────────────────────
  gameState = STATE.MENU;
  currentLevel = 0;
  gameLoop();

  console.log('🧮 数学大冒险准备好了！');
  console.log('🎯 10关闯关 · 50以内加减法');
  console.log('🖱️ 点击答案按钮 · 或按数字键1-4');
  console.log('⌨️ 按空格键开始游戏');
})();
</script>
